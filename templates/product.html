{% extends 'base.html' %}{% block content %}<div class="detail"><img src="{{ product.image_url }}"><div><small>{{ product.category }} · ★ {{ product.rating }}</small><h1>{{ product.name }}</h1><div class="price big">₹{{ '{:,.0f}'.format(product.price) }} <del>₹{{ '{:,.0f}'.format(product.old_price) }}</del></div><p>{{ product.description }}</p><p><b>Stock:</b> {{ product.stock }} available</p><form method="post" action="/cart/add/{{ product.id }}"><label>Quantity <input type="number" name="quantity" value="1" min="1" max="{{ product.stock }}"></label><button class="btn">Add to cart</button></form><a href="/">← Continue shopping</a></div></div>{% endblock %}
